services:
  # Backend FastAPI API Service
  - type: web
    name: glowguide-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: PRICE_STALE_HOURS
        value: 24
      - key: ALLOW_FACE_STORAGE
        value: false

  # Frontend React UI Static Site
  - type: static_site
    name: glowguide-frontend
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
